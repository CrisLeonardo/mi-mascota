{% extends "base.html" %}
{% block titulo %}Mascotas{% endblock %}
{% block content %}
<div class="page-header">
  <h1><i class="bi bi-piggy-bank"></i> Mascotas</h1>
  {% if puede_gestionar %}<a class="btn btn-primary" href="{% url 'clientes:mascota_crear' %}"><i class="bi bi-plus-lg"></i> Nueva mascota</a>{% endif %}
</div>

<form method="get" data-busqueda data-destino="#resultados" class="row g-2 mb-3">
  <div class="col-12 col-md-5"><input type="search" name="q" value="{{ request.GET.q }}" class="form-control" placeholder="Buscar por mascota, raza o dueño" autocomplete="off"></div>
  <div class="col-6 col-md-3">
    <select name="especie" class="form-select" aria-label="Especie">
      <option value="">Todas las especies</option>
      {% for valor, etiqueta in especies %}<option value="{{ valor }}" {% if request.GET.especie == valor %}selected{% endif %}>{{ etiqueta }}</option>{% endfor %}
    </select>
  </div>
  <div class="col-6 col-md-2">
    <select name="estado" class="form-select" aria-label="Estado">
      <option value="">Activas</option>
      <option value="inactivos" {% if request.GET.estado == 'inactivos' %}selected{% endif %}>Inactivas</option>
      <option value="todos" {% if request.GET.estado == 'todos' %}selected{% endif %}>Todas</option>
    </select>
  </div>
  <div class="col-auto"><button class="btn btn-outline-primary" type="submit"><i class="bi bi-search"></i></button></div>
</form>

<div id="resultados">{% include "clientes/_mascota_tabla.html" %}</div>
{% endblock %}
