# Blueprint de Render: crea la base de datos PostgreSQL y el servicio web.
# Uso: Render > New > Blueprint > selecciona el repositorio de GitHub.
databases:
  - name: mi-mascota-db
    plan: free
    databaseName: mi_mascota

services:
  - type: web
    name: mi-mascota
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    healthCheckPath: /cuentas/login/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: mi-mascota-db
          property: connectionString
      - key: DJANGO_ADMIN_USER
        value: admin
      - key: DJANGO_ADMIN_PASSWORD
        sync: false        # se escribe a mano en el panel de Render (no queda en Git)
      - key: SEED_DEMO
        value: "true"      # cámbialo a "false" cuando ya no quieras datos de ejemplo
