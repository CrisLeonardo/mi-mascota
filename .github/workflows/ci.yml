name: CI

# Se ejecuta en cada push y en cada Pull Request hacia main/develop.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  pruebas:
    runs-on: ubuntu-latest

    # Base de datos PostgreSQL temporal para las pruebas (igual que en producción).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mi_mascota_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mi_mascota_test
      DJANGO_SECRET_KEY: clave-solo-para-ci-no-usar-en-produccion-0123456789
      DJANGO_DEBUG: "False"
      DJANGO_SSL_REDIRECT: "False"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Verificar configuración de Django
        run: python manage.py check

      - name: Verificar que no falten migraciones
        run: python manage.py makemigrations --check --dry-run

      # Con DEBUG=False las plantillas necesitan el manifest de estáticos (igual que en producción).
      - name: Recolectar archivos estáticos
        run: python manage.py collectstatic --noinput

      - name: Ejecutar pruebas automáticas
        run: python manage.py test --verbosity 2
