{% extends "base.html" %}
{% block titulo %}Iniciar sesión{% endblock %}
{% block layout %}
<div class="auth-wrap">
  <div class="card auth-card shadow">
    <div class="card-body p-4">
      <div class="text-center mb-4">
        <i class="bi bi-heart-pulse-fill" style="font-size: 2.5rem; color: var(--marca);"></i>
        <h1 class="h4 mt-2 mb-0">{{ NEGOCIO_NOMBRE }}</h1>
        <p class="text-muted small">Sistema de gestión de la clínica</p>
      </div>
      <form method="post" class="needs-validation" novalidate>
        {% csrf_token %}
        {% if form.non_field_errors %}<div class="alert alert-danger py-2">{{ form.non_field_errors }}</div>{% endif %}
        <input type="hidden" name="next" value="{{ next }}">
        <div class="mb-3">
          <label class="form-label" for="{{ form.username.id_for_label }}">Usuario</label>
          <input type="text" name="username" id="{{ form.username.id_for_label }}" class="form-control" autofocus required autocomplete="username" value="{{ form.username.value|default:'' }}">
          <div class="invalid-feedback">Escribe tu usuario.</div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="{{ form.password.id_for_label }}">Contraseña</label>
          <input type="password" name="password" id="{{ form.password.id_for_label }}" class="form-control" required autocomplete="current-password">
          <div class="invalid-feedback">Escribe tu contraseña.</div>
        </div>
        <button class="btn btn-primary w-100" type="submit"><i class="bi bi-box-arrow-in-right"></i> Entrar</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
